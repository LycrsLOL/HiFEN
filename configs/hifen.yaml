project:
  name: HiFEN
storage:
  save_dir: data
  project_artifact_dir: artifacts
  manifest_dir: artifacts/manifests
  graph_dir: data/train/graph
  checkpoint_dir: artifacts/checkpoints
  label_map_dir: artifacts/label_maps
  split_dir: artifacts/splits
  metrics_dir: artifacts/metrics
  reproducibility_dir: artifacts/reproducibility
  graph_cache_mode: thin
  save_embedding_in_graph: true
  graph_embedding_dtype: float16
  skip_existing: true
  overwrite_existing: false
  check_disk_before_write: true
runtime_outputs:
  log_dir: artifacts/logs
  inference_result_dir: artifacts/predictions
datasets:
  train:
    csv: data/train.csv
    output_subdir: train
    role: train
esm:
  checkpoint: checkpoints/esm3_sm_open_v1.pth
  embedding_dim: 1536
  device: cuda:0
deployment:
  allow_download: true
  allow_completion: true
  allow_generate_embedding: true
  allow_recompute_embedding: false
  download_predicted_structures: true
  structure_completion_workers: 32
  pdb_quality_api_url: https://data.rcsb.org/graphql
  pdb_quality_batch_size: 100
  pdb_quality_timeout_seconds: 60
  pdb_quality_retries: 3
  pdb_quality_retry_backoff_seconds: 2.0
  pipeline_graph_after_completion: true
  compress_structures_after_graph: false
  delete_raw_structures_after_compress: false
  structure_archive_format: tar.zst
  require_self_contained_graph_before_structure_delete: true
  download_predicted_structure_datasets:
  - train
  recursive_index: true
  dry_run: false
  embedding_device: cuda:0
structure_completion:
  min_predicted_plddt: 50.0
  min_anchor_residues: 8
  max_anchor_rmsd: 8.0
structure_download:
  source: alphafold
  pdb_cif_url_templates:
  - https://files.rcsb.org/download/{pdb_id}.cif
  - https://files.rcsb.org/download/{pdb_id_upper}.cif
  use_alphafold_api: false
  alphafold_api_url_template: https://alphafold.ebi.ac.uk/api/prediction/{uniprot_id}
  alphafold_versions:
  - 6
  - 5
  - 4
  alphafold_cif_url_template: https://alphafold.ebi.ac.uk/files/AF-{uniprot_id}-F1-model_v{version}.cif
  timeout_seconds: 8
  download_retries: 1
  download_retry_backoff_seconds: 0.0
  local_alphafold_fallback: false
  local_alphafold_backend: alphafold
  local_alphafold_binary: colabfold_batch
  local_alphafold_params_dir: checkpoints/alphafold_params
  local_alphafold_work_dir: artifacts/alphafold_work
  local_alphafold_model_name: model_1_ptm
  local_alphafold_msa_mode: single_sequence
  local_alphafold_model_type: alphafold2_ptm
  local_alphafold_num_models: 1
  local_alphafold_num_recycle: 3
  local_alphafold_timeout_seconds: 21600
  local_alphafold_max_length: 4000
  local_alphafold_amber: false
  local_alphafold_cuda_visible_devices: '0'
features:
  use_annotation_features: true
  annotation_feature_mode: domain_motif
  use_site_truth_as_input: false
graph:
  cutoff: 10.0
  dtype: float16
  max_embedding_structure_delta: 32
  use_sequence_structure_alignment: true
  min_structure_alignment_fraction: 0.8
model:
  type: hifen
  input_dim: 1536
  annotation_dim: 12
  hidden_dim: 512
  num_layers: 4
  heads: 8
  dropout: 0.3
  edge_rbf_dim: 16
  use_multiscale_pooling: true
  use_layerwise_fusion: true
  use_parent_conditioning: true
  detach_parent_conditioning: true
  parent_conditioning_mode: residual_gate
  parent_residual_gate_init: 0.1
  conditional_hierarchy_mode: adaptive_residual
  conditional_hierarchy_gate_init: 0.08
  conditional_hierarchy_gate_max: 0.35
  use_confidence_features: true
  use_structure_aux_heads: false
  use_predicted_site_feedback: true
  detach_predicted_site_feedback: true
  predicted_site_feedback_start_epoch: 3
  predicted_site_feedback_warmup_epochs: 5
  predicted_site_fusion_mode: residual_gate
  predicted_site_gate_init: 0.1
  predicted_site_residual_scale: 0.5
  use_function_hypergraph: true
  use_hypergraph_main_feedback: false
  detach_hypergraph_site_probabilities: true
  hypergraph_start_epoch: 8
  hypergraph_feedback_layer: 2
  hypergraph_slots_per_task: 1
  hypergraph_gate_init: 0.1
  use_conditional_hierarchy: true
  modality_fusion_mode: learned
  modality_dropout: 0.1
  sequence_modality_dropout: 0.02
  site_heads: true
  include_structure_in_modality_fusion: false
  hypergraph_auxiliary_head: true
  hypergraph_tasks:
  - active_or_catalytic_site
  - binding_site
  hypergraph_assignment_mode: softmax
  hypergraph_assignment_temperature: 0.75
  hypergraph_site_probability_threshold: 0.2
  hypergraph_min_edge_mass: 0.1
  hypergraph_preserve_site_confidence: true
  hypergraph_context_mode: task_attention
  hypergraph_confidence_power: 0.5
  hypergraph_contrastive_context: true
  hypergraph_min_feedback_gate: 0.05
  hypergraph_max_feedback_gate: 0.1
  hypergraph_warmup_epochs: 8
  pooling_mode: hybrid
  hybrid_pool_level_init: 0.75
  tool_annotation_dropout: 0.3
  tool_annotation_fusion_mode: residual_gate
  tool_annotation_gate_init: 0.1
  tool_annotation_residual_scale: 0.5
  tool_annotation_start_epoch: 1
  tool_annotation_warmup_epochs: 5
loss:
  focal_gamma: 2.0
  class_balance: effective_number
  class_balance_beta: 0.999
  class_balance_power: 0.5
  class_balance_min_weight: 0.25
  class_balance_max_weight: 5.0
  ignore_empty_label_levels:
  - ec2
  - ec3
  - ec4
  single_label_auxiliary_weight: 0.25
  single_label_auxiliary_levels:
  - ec4
  single_label_auxiliary_class_weight: true
  hierarchy_consistency_weight: 0.01
  conditional_hierarchy_weight: 0.02
  modality_balance_weight: 0.0
  auxiliary_site_weight: 0.05
  intermediate_site_weight: 0.05
  site_focal_gamma: 2.0
  site_task_weights:
    active_or_catalytic_site: 1.0
    binding_site: 1.0
    domain_region: 0.25
    motif_region: 0.25
  site_positive_weights:
    active_or_catalytic_site: 2.0
    binding_site: 2.0
    domain_region: 1.0
    motif_region: 3.0
  structure_aux_weight: 0.0
  structure_distance_weight: 1.0
  structure_contact_weight: 0.5
  structure_contact_cutoff: 8.0
  ec_level_weights:
    ec1: 0.5
    ec2: 0.8
    ec3: 1.0
    ec4: 1.3
  primary_loss: focal_bce
  hypergraph_auxiliary_weight: 0.01
metrics:
  async: true
  async_workers: 1
  max_pending: 1
  recover_pending_on_start: false
  cache_compressed: false
  keep_prediction_cache: false
  keep_epoch_checkpoints: false
  threshold: 0.5
  threshold_steps: 51
  core_threshold_mode: auto
  threshold_unseen_fallback: global
  threshold_fbeta: 1.0
  threshold_low_fbeta: 2.0
  threshold_high_fbeta: 1.0
  core_threshold_cv_folds: 3
  core_selection_score_weights:
    val_ec4_f1_macro_observed: 0.35
    val_ec4_single_label_f1_macro: 0.20
    val_ec4_auprc_micro: 0.15
    val_ec4_low_f1_macro_observed: 0.20
    val_ec4_low_recall_macro_observed: 0.10
  threshold_min: 0.05
  threshold_max: 0.95
  threshold_calibration_fraction: 0.2
  core_threshold_calibration_fraction: 0.2
  threshold_calibration_seed: 42
  hierarchy_postprocess: none
  topk:
  - 1
  - 3
  - 5
  - 10
  fmax_steps: 101
  calibration_bins: 15
  frequency_bucket_schema: low_high_v1
  low_max_support: 50
  bootstrap_resamples: 0
  bootstrap_seed: 42
  profile: fast
  progress: true
  full_interval: 0
  full_first_epoch: false
  full_after_training_best: true
train:
  split_strategy: homology
  homology_cluster_column: homology_cluster
  pdb_graph_selection:
    enabled: true
    mode: quality
    max_graphs_per_uniprot: 1
    quality_cache_path: artifacts/manifests/pdb_candidate_quality.json
  batch_size: 32
  epochs: 160
  learning_rate: 7.5e-05
  lr_scheduler: warmup_cosine
  warmup_epochs: 4
  min_lr_ratio: 0.05
  weight_decay: 0.01
  reset_optimizer_on_resume: false
  threshold_mode: auto
  seed: 42
  cpu_threads: 4
  cpu_interop_threads: 4
  num_workers: 2
  prefetch_factor: 2
  val_fraction: 0.1
  test_fraction: 0.1
  force_resplit: false
  closed_set_split:
    enabled: true
    rebalance: true
  device: cuda
  amp: false
  distributed: auto
  dist_backend: nccl
  dist_url: env://
  dist_timeout_seconds: 7200
  find_unused_parameters: true
  broadcast_buffers: true
  distributed_drop_last: false
  pin_memory: true
  persistent_workers: true
  tail_sampler:
    enabled: true
    level: ec4
    tail_max_support: 10
    power: 0.25
    base_weight: 1.0
    tail_min_weight: 1.5
    empty_weight: 0.5
    min_weight: 0.5
    max_weight: 2.0
    replacement: true
  gradient_clip_norm: 0.5
  parameter_norm_guard:
    enabled: false
    max_growth_factor: 32.0
    patterns:
    - backbone.convs.*.lin_r.weight
    - backbone.convs.*.lin_r.bias
  log_interval: 100
  monitor_metric: val_core_selection_score
  monitor_mode: max
  early_stopping_patience: 20
  data_augmentation:
    node_feature_mask:
      enabled: true
      level: ec4
      tail_max_support: 10
      apply_probability: 0.5
      mask_ratio: 0.1
      protect_site_positive: true
      protected_hops: 1
      fill_value: zero
      min_nodes: 20
  init_checkpoint: null
  init_checkpoint_strict: false
  init_checkpoint_remap_label_heads: false
  archive_metric_history_on_fresh_start: true
  dynamic_label_encoding: true
mode: train
swanlab:
  enabled: false
  project: HiFEN
  workspace: null
  credential_root: null
  mode: disabled
  public: false
  experiment_name: hifen-full
  group: null
  tags:
  - full
  description: Full HiFEN model training.
  log_dir: artifacts/swanlab
  fail_on_error: false
run:
  name: hifen_full
  recommended_gpus: 2
  global_batch_size: 64
