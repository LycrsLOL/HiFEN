# Complete HiFEN model: four modules.
# 1. Layerwise fusion
# 2. Parent conditioning
# 3. Annotation encoding (tool annotations)
# 4. Structure completion (graph preparation)
# Run a single-module ablation with --profile without_<module>.
project:
  name: HiFEN
storage:
  save_dir: data
  project_artifact_dir: artifacts
  manifest_dir: artifacts/manifests
  graph_dir: data/train/graph
  checkpoint_dir: artifacts/checkpoints
  label_map_dir: artifacts/label_maps
  split_dir: artifacts/splits
  metrics_dir: artifacts/metrics
  reproducibility_dir: artifacts/reproducibility
  graph_cache_mode: thin
  save_embedding_in_graph: true
  graph_embedding_dtype: float16
  skip_existing: true
  overwrite_existing: false
  check_disk_before_write: true
runtime_outputs:
  log_dir: artifacts/logs
  inference_result_dir: artifacts/predictions
datasets:
  train:
    csv: data/train.csv
    output_subdir: train
    role: train
esm:
  checkpoint: checkpoints/esm3_sm_open_v1.pth
  embedding_dim: 1536
  device: cuda:0
deployment:
  allow_download: true
  allow_completion: true
  allow_generate_embedding: true
  allow_recompute_embedding: false
  download_predicted_structures: true
  structure_completion_workers: 32
  pdb_quality_api_url: https://data.rcsb.org/graphql
  pdb_quality_batch_size: 100
  pdb_quality_timeout_seconds: 60
  pdb_quality_retries: 3
  pdb_quality_retry_backoff_seconds: 2.0
  pipeline_graph_after_completion: true
  compress_structures_after_graph: false
  delete_raw_structures_after_compress: false
  structure_archive_format: tar.zst
  require_self_contained_graph_before_structure_delete: true
  download_predicted_structure_datasets:
  - train
  recursive_index: true
  dry_run: false
  embedding_device: cuda:0
structure_completion:
  min_predicted_plddt: 50.0
  min_anchor_residues: 8
  max_anchor_rmsd: 8.0
structure_download:
  source: alphafold
  pdb_cif_url_templates:
  - https://files.rcsb.org/download/{pdb_id}.cif
  - https://files.rcsb.org/download/{pdb_id_upper}.cif
  use_alphafold_api: false
  alphafold_api_url_template: https://alphafold.ebi.ac.uk/api/prediction/{uniprot_id}
  alphafold_versions:
  - 6
  - 5
  - 4
  alphafold_cif_url_template: https://alphafold.ebi.ac.uk/files/AF-{uniprot_id}-F1-model_v{version}.cif
  timeout_seconds: 8
  download_retries: 1
  download_retry_backoff_seconds: 0.0
  local_alphafold_fallback: false
  local_alphafold_backend: alphafold
  local_alphafold_binary: colabfold_batch
  local_alphafold_params_dir: checkpoints/alphafold_params
  local_alphafold_work_dir: artifacts/alphafold_work
  local_alphafold_model_name: model_1_ptm
  local_alphafold_msa_mode: single_sequence
  local_alphafold_model_type: alphafold2_ptm
  local_alphafold_num_models: 1
  local_alphafold_num_recycle: 3
  local_alphafold_timeout_seconds: 21600
  local_alphafold_max_length: 4000
  local_alphafold_amber: false
  local_alphafold_cuda_visible_devices: '0'
features:
  use_annotation_features: true
  annotation_feature_mode: domain_motif
graph:
  cutoff: 10.0
  dtype: float16
  max_embedding_structure_delta: 32
  use_sequence_structure_alignment: true
  min_structure_alignment_fraction: 0.8
model:
  type: hifen
  input_dim: 1536
  annotation_dim: 12
  hidden_dim: 512
  num_layers: 4
  heads: 8
  dropout: 0.3
  edge_rbf_dim: 16
  use_layerwise_fusion: true
  use_parent_conditioning: true
  detach_parent_conditioning: true
  parent_conditioning_mode: residual_gate
  parent_residual_gate_init: 0.1
  use_function_hypergraph: false
  tool_annotation_dropout: 0.3
  tool_annotation_gate_init: 0.1
  tool_annotation_residual_scale: 0.5
  tool_annotation_start_epoch: 1
  tool_annotation_warmup_epochs: 5
loss:
  focal_gamma: 2.0
  class_balance: effective_number
  class_balance_beta: 0.999
  class_balance_power: 0.5
  class_balance_min_weight: 0.25
  class_balance_max_weight: 5.0
  ignore_empty_label_levels:
  - ec2
  - ec3
  - ec4
  auxiliary_site_weight: 0.0
  intermediate_site_weight: 0.0
  ec_level_weights:
    ec1: 0.5
    ec2: 0.8
    ec3: 1.0
    ec4: 1.3
  primary_loss: focal_bce
metrics:
  async: true
  async_workers: 1
  max_pending: 1
  recover_pending_on_start: false
  cache_compressed: false
  keep_prediction_cache: false
  keep_epoch_checkpoints: false
  threshold: 0.5
  threshold_steps: 51
  core_threshold_mode: auto
  threshold_unseen_fallback: global
  threshold_fbeta: 1.0
  threshold_low_fbeta: 2.0
  threshold_high_fbeta: 1.0
  core_threshold_cv_folds: 3
  core_selection_score_weights:
    val_ec4_f1_macro_observed: 0.35
    val_ec4_single_label_f1_macro: 0.2
    val_ec4_auprc_micro: 0.15
    val_ec4_low_f1_macro_observed: 0.2
    val_ec4_low_recall_macro_observed: 0.1
  threshold_min: 0.05
  threshold_max: 0.95
  threshold_calibration_fraction: 0.2
  core_threshold_calibration_fraction: 0.2
  threshold_calibration_seed: 42
  hierarchy_postprocess: none
  topk:
  - 1
  - 3
  - 5
  - 10
  fmax_steps: 101
  calibration_bins: 15
  frequency_bucket_schema: low_high_v1
  low_max_support: 50
  bootstrap_resamples: 0
  bootstrap_seed: 42
  profile: fast
  progress: true
  full_interval: 0
  full_first_epoch: false
  full_after_training_best: true
train:
  # Fixed S2 manifests are resolved relative to the repository (config directory's parent).
  # Set null explicitly to generate splits for a different dataset.
  fixed_split_dir: .
  split_strategy: homology
  homology_cluster_column: homology_cluster
  pdb_graph_selection:
    enabled: true
    mode: quality
    max_graphs_per_uniprot: 1
    quality_cache_path: artifacts/manifests/pdb_candidate_quality.json
  batch_size: 32
  epochs: 160
  learning_rate: 7.5e-05
  lr_scheduler: warmup_cosine
  warmup_epochs: 4
  min_lr_ratio: 0.05
  weight_decay: 0.01
  reset_optimizer_on_resume: false
  threshold_mode: auto
  seed: 42
  cpu_threads: 4
  cpu_interop_threads: 4
  num_workers: 2
  prefetch_factor: 2
  val_fraction: 0.1
  test_fraction: 0.1
  force_resplit: false
  closed_set_split:
    enabled: true
    rebalance: true
  device: cuda
  amp: false
  distributed: auto
  dist_backend: nccl
  dist_url: env://
  dist_timeout_seconds: 7200
  find_unused_parameters: true
  broadcast_buffers: true
  distributed_drop_last: false
  pin_memory: true
  persistent_workers: true
  tail_sampler:
    enabled: true
    level: ec4
    tail_max_support: 10
    power: 0.25
    base_weight: 1.0
    tail_min_weight: 1.5
    empty_weight: 0.5
    min_weight: 0.5
    max_weight: 2.0
    replacement: true
  gradient_clip_norm: 0.5
  parameter_norm_guard:
    enabled: false
    max_growth_factor: 32.0
    patterns:
    - backbone.convs.*.lin_r.weight
    - backbone.convs.*.lin_r.bias
  log_interval: 100
  monitor_metric: val_core_selection_score
  monitor_mode: max
  early_stopping_patience: 20
  data_augmentation:
    node_feature_mask:
      enabled: true
      level: ec4
      tail_max_support: 10
      apply_probability: 0.5
      mask_ratio: 0.1
      protect_site_positive: true
      protected_hops: 1
      fill_value: zero
      min_nodes: 20
  init_checkpoint: null
  init_checkpoint_strict: false
  init_checkpoint_remap_label_heads: false
  archive_metric_history_on_fresh_start: true
  dynamic_label_encoding: true
mode: train
swanlab:
  enabled: false
  project: HiFEN
  workspace: null
  credential_root: null
  mode: disabled
  public: false
  experiment_name: hifen-full
  group: null
  tags:
  - full
  description: 'HiFEN: layerwise fusion, parent conditioning, annotation encoding,
    structure completion.'
  log_dir: artifacts/swanlab
  fail_on_error: false
run:
  name: hifen_full
  recommended_gpus: 2
  global_batch_size: 64
default_profile: full
profiles:
  full: {}
  without_layerwise_fusion:
    model:
      use_layerwise_fusion: false
    run:
      name: hifen_without_layerwise_fusion
    swanlab:
      experiment_name: hifen-without_layerwise_fusion
      tags:
      - without_layerwise_fusion
      description: HiFEN without_layerwise_fusion.
    storage:
      checkpoint_dir: artifacts/without_layerwise_fusion/checkpoints
      metrics_dir: artifacts/without_layerwise_fusion/metrics
      reproducibility_dir: artifacts/without_layerwise_fusion/reproducibility
    runtime_outputs:
      log_dir: artifacts/without_layerwise_fusion/logs
      inference_result_dir: artifacts/without_layerwise_fusion/predictions
  without_parent_conditioning:
    model:
      use_parent_conditioning: false
    run:
      name: hifen_without_parent_conditioning
    swanlab:
      experiment_name: hifen-without_parent_conditioning
      tags:
      - without_parent_conditioning
      description: HiFEN without_parent_conditioning.
    storage:
      checkpoint_dir: artifacts/without_parent_conditioning/checkpoints
      metrics_dir: artifacts/without_parent_conditioning/metrics
      reproducibility_dir: artifacts/without_parent_conditioning/reproducibility
    runtime_outputs:
      log_dir: artifacts/without_parent_conditioning/logs
      inference_result_dir: artifacts/without_parent_conditioning/predictions
  without_tool_annotations:
    features:
      use_annotation_features: false
    run:
      name: hifen_without_tool_annotations
    swanlab:
      experiment_name: hifen-without_tool_annotations
      tags:
      - without_tool_annotations
      description: HiFEN without_tool_annotations.
    storage:
      checkpoint_dir: artifacts/without_tool_annotations/checkpoints
      metrics_dir: artifacts/without_tool_annotations/metrics
      reproducibility_dir: artifacts/without_tool_annotations/reproducibility
    runtime_outputs:
      log_dir: artifacts/without_tool_annotations/logs
      inference_result_dir: artifacts/without_tool_annotations/predictions
  without_structure_completion:
    deployment:
      allow_completion: false
      pipeline_graph_after_completion: false
    run:
      name: hifen_without_structure_completion
    swanlab:
      experiment_name: hifen-without_structure_completion
      tags:
      - without_structure_completion
      description: HiFEN without_structure_completion.
    storage:
      checkpoint_dir: artifacts/without_structure_completion/checkpoints
      metrics_dir: artifacts/without_structure_completion/metrics
      reproducibility_dir: artifacts/without_structure_completion/reproducibility
      save_dir: data/without_structure_completion
      project_artifact_dir: artifacts/without_structure_completion
      manifest_dir: artifacts/without_structure_completion/manifests
      graph_dir: data/without_structure_completion/train/graph
      label_map_dir: artifacts/without_structure_completion/label_maps
      split_dir: artifacts/without_structure_completion/splits
    runtime_outputs:
      log_dir: artifacts/without_structure_completion/logs
      inference_result_dir: artifacts/without_structure_completion/predictions
